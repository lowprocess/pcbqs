[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbqs"
dynamic = ["version"]
description = "PCB power integrity, quasistatic fields and operational circuit analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "shapely>=2.0", "triangle>=20230923",
    "matplotlib>=3.7", "threadpoolctl>=3.1", "pillow>=9",
    "emsdev @ https://github.com/lowprocess/emsdev/archive/refs/heads/main.zip",
]

[project.optional-dependencies]
core = ["pybind11>=2.10"]
gpu-cuda12 = ["cupy-cuda12x>=14"]
gpu-cuda13 = ["cupy-cuda13x>=14"]
gpu-rocm7 = ["cupy-rocm-7-0>=14"]
kicad2ems = ["kicad2ems>=261112.post1"]    # the board importer, and the analysis plugins below (kicad2ems.api 2.6)
test = ["pytest>=7"]

# the tools as kicad2ems analyses: its --check, its configs' [analysis] tables and kicad2ems-gui's Study list them
[project.entry-points."kicad2ems.analyses"]
pdn = "pcbqs.analyses:PowerIntegrity"
mqs = "pcbqs.analyses:NearField"
circuit = "pcbqs.analyses:Circuit"
thermal = "pcbqs.analyses:Thermal"

[tool.setuptools.dynamic]
version = {attr = "pcbqs.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbqs = ["core/*.cpp", "core/*.hpp", "data/*.json", "data/*.toml", "circuit/examples/*.json", "circuit/examples/*.kicad_pcb",
         "circuit/examples/*.toml", "PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
pcbqs = ["*.so", "*.pyd"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "preserve"
