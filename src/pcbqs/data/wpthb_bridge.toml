# pcbqs circuit example: the wpthb board's phase-shifted full bridge driving a wireless-power link
#   python -m pcbqs.circuit wpthb_bridge.json --out out/wpthb_bridge
# The model names that board's own parts and pads (board.parts, board.reference): name the board under Board (it is
# not shipped) to include its copper; without one the circuit runs alone.
out   = "out"

[analysis]
run = ["circuit"]

[analysis.circuit]
model = "wpthb_bridge.json"
