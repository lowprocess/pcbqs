# pcbqs circuit example: a 50 Hz sine through one diode into a reservoir capacitor and a resistive load
#   python -m pcbqs.circuit 02_half_wave_rectifier.json --out out/half_wave_rectifier      # the circuit alone, from the command line
#   kicad2ems-gui: File > Examples > Circuits                     # the circuit on its board, in the window
board = "02_half_wave_rectifier.kicad_pcb"   # paths are relative to this file
out   = "out"

[analysis]
run = ["circuit"]   # a Run of the window: the circuit (no S-parameters)

[analysis.circuit]
model = "02_half_wave_rectifier.json"       # the parts, nodes and drives: the Circuit page's schematic
